{% extends "shared/base.html" %}
{% block title %}Create your account — deepvac Licensing{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Create your account</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        <label>Organization name
            {{ form.organization_name(autofocus=true) }}
            {% for e in form.organization_name.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <label>Your name
            {{ form.display_name() }}
            {% for e in form.display_name.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <label>Email
            {{ form.email() }}
            {% for e in form.email.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <label>Password
            {{ form.password() }}
            {% for e in form.password.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <label>Confirm password
            {{ form.confirm_password() }}
            {% for e in form.confirm_password.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <button type="submit" class="primary">Create account</button>
    </form>
    <p class="muted"><a href="{{ url_for('auth.login') }}">Already have an account? Sign in</a></p>
</div>
{% endblock %}
