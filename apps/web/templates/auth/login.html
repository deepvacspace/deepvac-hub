{% extends "shared/base.html" %}
{% block title %}Sign in — deepvac Licensing{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Sign in</h1>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post">
        {{ form.hidden_tag() }}
        <label>Email
            {{ form.email(autofocus=true) }}
            {% for e in form.email.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <label>Password
            {{ form.password() }}
            {% for e in form.password.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
        </label>
        <button type="submit" class="primary">Sign in</button>
    </form>
</div>
{% endblock %}
